# Default config for the A-share daily market theme radar.
# Do not put API tokens or secrets in this file. Use environment variables or
# local config/settings.yaml for provider-specific credentials.

providers:
  market: tushare
  news:
    - local_csv
  llm: none

news:
  lookback_hours: 36

news_scoring:
  default_authority_score: 50
  core_event_top_n: 10
  min_core_event_score: 60
  require_core_theme_match: true
  authority_scores:
    新华社: 95
    证监会: 95
    上交所: 95
    深交所: 95
    财联社: 80
    第一财经: 78
    华尔街见闻: 76
    中证网: 75
    同花顺: 70
    东方财富: 70
    新浪财经: 65

theme_score:
  weights:
    LimitUpStrength: 0.25
    Breadth: 0.20
    LeaderStrength: 0.15
    NewsCatalyst: 0.15
    VolumeExpansion: 0.10
    Persistence: 0.10
    Novelty: 0.05

output:
  base_dir: market_ai_runs
  report_dir: reports/market_radar
  cache_dir: data/cache/market_ai

strong_stock_min_pct_chg: 7.0
top_theme_count: 5
