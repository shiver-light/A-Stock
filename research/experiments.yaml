global:
  # Use a multi-year but still manageable window for the first formal research pass.
  # This is long enough to see different market regimes without turning the default
  # batch into an unnecessarily heavy full-history sweep.
  start_date: "20230101"
  end_date: "20260331"
  benchmark_code: "000300.SH"
  top_n: 20
  enable_factor_diagnostics: true
  analysis_horizons:
    - 5
    - 10
    - 20

experiments:
  - name: "hs300_baseline"
    universe_name: "hs300"
    factor_config:
      return_20d: 1.0
      volatility_20d: -1.0
      turnover_mean_20d: 1.0

