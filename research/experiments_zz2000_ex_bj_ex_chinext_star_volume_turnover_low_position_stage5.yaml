global:
  # ZZ2000 ex-BJ excluding ChiNext and STAR volume/turnover low-position research stage5.
  # Stage4 showed relaxed sell logic helped wider-capacity models but hurt strict
  # sparse-signal models. This stage only validates wider-capacity variants with
  # min_hold_days=2 and max_hold_days=7. Signal time: T close. Execution time: T+1.
  start_date: "20250101"
  end_date: "20260608"
  benchmark_code: "000985.CSI"
  universe_name: "zz2000_ex_bj_ex_chinext_star"
  rebalance_frequency: "daily"
  enable_factor_diagnostics: false
  analysis_horizons:
    - 1
    - 3
    - 5
    - 7
  backtest_config:
    slippage_bps: 15.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 300000.0
    position_exit_policy:
      enabled: true
      min_hold_days: 2
      max_hold_days: 7
      exit_filters:
        - factor: "ma20_slope_1d"
          op: "gte"
          value: -0.005
        - factor: "price_position_120d"
          op: "lte"
          value: 0.45

experiments:
  - name: "z20xvtlp5_01_ma-001_vr15_turn15_15_low35_top120"
    top_n: 120
    signal_filters:
      - factor: "volume_ratio_5d"
        op: "gte"
        value: 1.5
      - factor: "turnover_rate_f"
        op: "between"
        min_value: 1.5
        max_value: 15.0
      - factor: "ma20_slope_1d"
        op: "gte"
        value: -0.001
      - factor: "price_position_120d"
        op: "lte"
        value: 0.35
      - factor: "daily_return"
        op: "between"
        min_value: -0.03
        max_value: 0.08
    factor_config:
      low_position_120d: 0.30
      volume_ratio_5d: 0.15
      ma20_slope_1d: 0.20
      turnover_rate_f: 0.15
      amount_mean_20d: 0.10
      false_breakout_risk_negative: 0.10

