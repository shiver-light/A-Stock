global:
  # ZZ500 value stage3:
  # narrow validation around the strongest value line. Keep the same realistic
  # tradability assumptions as zz500_factor_expansion, and compare ep_ttm alone
  # against value-momentum and value-growth variants.
  # Signals are generated on T close and executed by the existing backtest path
  # on the next rebalance execution date.
  start_date: "20230101"
  end_date: "20260331"
  benchmark_code: "000300.SH"
  top_n: 20
  enable_factor_diagnostics: true
  analysis_horizons:
    - 5
    - 10
    - 20
  backtest_config:
    slippage_bps: 15.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 800000.0

experiments:
  - name: "zz5v3_01_ep_ttm_top10"
    universe_name: "zz500"
    top_n: 10
    factor_config:
      ep_ttm: 1.0

