global:
  # ZZ500 factor expansion:
  # extend the current zz500 research with interpretable value, quality,
  # turnover-control, trend-risk, and liquidity-quality factor families.
  # This is a compact research matrix, not a broad parameter search.
  # Signals are generated on T close and executed by the existing backtest path
  # on the next rebalance execution date.
  start_date: "20230101"
  end_date: "20260331"
  benchmark_code: "000300.SH"
  top_n: 20
  enable_factor_diagnostics: true
  analysis_horizons:
    - 5
    - 10
    - 20
  backtest_config:
    slippage_bps: 15.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 800000.0

