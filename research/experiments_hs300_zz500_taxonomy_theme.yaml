global:
  start_date: '20250101'
  end_date: '20260608'
  enable_factor_diagnostics: true
  analysis_horizons:
  - 5
  - 10
  - 20
  backtest_config:
    slippage_bps: 15.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 500000.0
  research_notes:
  - Theme labels are taxonomy keyword tags from local stock_basic fields; they are
    weaker than verified concept constituents.
  - Technology theme pool is a reproducible approximation built from stock_basic industry/name
    keywords.
  - Index membership is snapped at the configured pool_as_of_date to avoid using end-date
    constituents for the full backtest.
  - 'Signals follow the existing pipeline assumption: T close signal, next rebalance
    execution.'
  pool_as_of_date: '20250101'
  tag_as_of_date: '20250101'
  theme_taxonomy: research/theme_taxonomy.yaml
  theme_tags_csv: research/theme_tags_hs300_zz500_taxonomy.csv
  theme_pool_csv: research/theme_pool_hs300_zz500_taxonomy.csv
  selected_themes:
  - AI算力
  - 半导体国产替代
  - 机器人/具身智能
  selected_sub_themes: []
  min_theme_confidence: 0.7
