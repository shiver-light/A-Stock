global:
  # Stage2 iteration of volume/turnover low-position research.
  # Universe explicitly excludes ChiNext and ST-like stock names.
  # Signal time: T close. Execution time: T+1, unchanged from pipeline defaults.
  start_date: "20250101"
  end_date: "20260608"
  benchmark_code: "000985.CSI"
  universe_name: "all_a_ex_chinext_st"
  rebalance_frequency: "daily"
  enable_factor_diagnostics: false
  analysis_horizons:
    - 1
    - 3
    - 5
    - 7
  backtest_config:
    slippage_bps: 15.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 300000.0

experiments:
  - name: "vtlp2_01_vr20_turn2_12_retm2_8_low30_top50"
    top_n: 50
    signal_filters:
      - factor: "volume_ratio_5d"
        op: "gte"
        value: 2.0
      - factor: "turnover_rate_f"
        op: "between"
        min_value: 2.0
        max_value: 12.0
      - factor: "ma20_slope_1d"
        op: "gte"
        value: 0.0
      - factor: "price_position_120d"
        op: "lte"
        value: 0.30
      - factor: "daily_return"
        op: "between"
        min_value: -0.02
        max_value: 0.08
    factor_config:
      low_position_120d: 0.30
      volume_ratio_5d: 0.20
      ma20_slope_1d: 0.20
      turnover_rate_f: 0.15
      amount_mean_20d: 0.05
      false_breakout_risk_negative: 0.10

