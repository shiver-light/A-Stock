global:
  # Announcement-day shareholder count decline research.
  # Universe excludes ChiNext, STAR Market, and ST stocks.
  # holder_num_change_ratio_negative_fresh_3d_announced_today is only valid
  # when trade_date equals ann_date and ann_date is less than 3 trading days
  # after end_date. Signal time: T close. Execution time: T+1.
  start_date: "20250101"
  end_date: "20260608"
  benchmark_code: "000985.CSI"
  universe_name: "all_a_ex_chinext_star_st"
  rebalance_frequency: "daily"
  enable_factor_diagnostics: false
  analysis_horizons:
    - 1
    - 3
    - 5
    - 10
    - 20
  backtest_config:
    slippage_bps: 15.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 300000.0
    position_exit_policy:
      enabled: true
      min_hold_days: 3
      max_hold_days: 20
      exit_filters:
        - factor: "price_position_120d"
          op: "lte"
          value: 0.65
        - factor: "false_breakout_risk_negative"
          op: "gte"
          value: -0.08

experiments:
  - name: "hdeclann_01_single_top20"
    top_n: 20
    signal_filters:
      - factor: "holder_num_change_ratio_negative_fresh_3d_announced_today"
        op: "gte"
        value: 0.03
    factor_config:
      holder_num_change_ratio_negative_fresh_3d_announced_today: 1.00

  - name: "hdeclann_02_low_position_top20"
    top_n: 20
    signal_filters:
      - factor: "holder_num_change_ratio_negative_fresh_3d_announced_today"
        op: "gte"
        value: 0.03
      - factor: "price_position_120d"
        op: "lte"
        value: 0.50
    factor_config:
      holder_num_change_ratio_negative_fresh_3d_announced_today: 0.55
      low_position_120d: 0.25
      amount_mean_20d: 0.20

  - name: "hdeclann_03_low_volume_confirm_top20"
    top_n: 20
    signal_filters:
      - factor: "holder_num_change_ratio_negative_fresh_3d_announced_today"
        op: "gte"
        value: 0.03
      - factor: "price_position_120d"
        op: "lte"
        value: 0.50
      - factor: "volume_ratio_5d"
        op: "gte"
        value: 1.2
    factor_config:
      holder_num_change_ratio_negative_fresh_3d_announced_today: 0.40
      low_position_120d: 0.20
      volume_ratio_5d: 0.15
      ma20_slope_1d: 0.15
      amount_mean_20d: 0.10

  - name: "hdeclann_04_low_turnover_confirm_top30"
    top_n: 30
    signal_filters:
      - factor: "holder_num_change_ratio_negative_fresh_3d_announced_today"
        op: "gte"
        value: 0.02
      - factor: "price_position_120d"
        op: "lte"
        value: 0.60
      - factor: "turnover_rate_f"
        op: "between"
        min_value: 1.0
        max_value: 12.0
    factor_config:
      holder_num_change_ratio_negative_fresh_3d_announced_today: 0.40
      low_position_120d: 0.20
      turnover_rate_f: 0.15
      ma20_slope_1d: 0.15
      false_breakout_risk_negative: 0.10

  - name: "hdeclann_05_risk_control_top20"
    top_n: 20
    signal_filters:
      - factor: "holder_num_change_ratio_negative_fresh_3d_announced_today"
        op: "gte"
        value: 0.03
      - factor: "price_position_120d"
        op: "lte"
        value: 0.50
      - factor: "daily_return"
        op: "between"
        min_value: -0.03
        max_value: 0.08
    factor_config:
      holder_num_change_ratio_negative_fresh_3d_announced_today: 0.40
      low_position_120d: 0.20
      false_breakout_risk_negative: 0.15
      volatility_20d_negative: 0.15
      amount_mean_20d: 0.10
