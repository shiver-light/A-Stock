global:
  # HS300 factor expansion:
  # extend the current turnover-led HS300 line with interpretable factor
  # families. This is a compact research matrix, not a broad parameter search.
  # Signals are generated on T close and executed by the existing backtest path
  # on the next rebalance execution date.
  start_date: "20230101"
  end_date: "20260331"
  benchmark_code: "000300.SH"
  top_n: 10
  enable_factor_diagnostics: true
  analysis_horizons:
    - 5
    - 10
    - 20
  backtest_config:
    slippage_bps: 10.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 300000.0

experiments:
  - name: "hsf_01_hs300_turnover_baseline_top10"
    universe_name: "hs300"
    top_n: 10
    factor_config:
      turnover_mean_20d: 1.0

  - name: "hsf_02_hs300_turnover_baseline_top20"
    universe_name: "hs300"
    top_n: 20
    factor_config:
      turnover_mean_20d: 1.0

  - name: "hsf_03_hs300_turnover_stability_top10"
    universe_name: "hs300"
    top_n: 10
    factor_config:
      turnover_mean_20d: 0.6
      turnover_stability_20d: 0.4

  - name: "hsf_04_hs300_turnover_stability_top20"
    universe_name: "hs300"
    top_n: 20
    factor_config:
      turnover_mean_20d: 0.6
      turnover_stability_20d: 0.4

  - name: "hsf_05_hs300_turnover_momentum_top10"
    universe_name: "hs300"
    top_n: 10
    factor_config:
      turnover_mean_20d: 0.5
      return_60d: 0.3
      return_5d_negative: 0.2

  - name: "hsf_06_hs300_turnover_momentum_top20"
    universe_name: "hs300"
    top_n: 20
    factor_config:
      turnover_mean_20d: 0.5
      return_60d: 0.3
      return_5d_negative: 0.2

  - name: "hsf_07_hs300_quality_value_top10"
    universe_name: "hs300"
    top_n: 10
    factor_config:
      ep_ttm: 0.4
      bp: 0.3
      roe_ttm: 0.3

  - name: "hsf_08_hs300_quality_value_top20"
    universe_name: "hs300"
    top_n: 20
    factor_config:
      ep_ttm: 0.4
      bp: 0.3
      roe_ttm: 0.3

  - name: "hsf_09_hs300_defensive_trend_top10"
    universe_name: "hs300"
    top_n: 10
    factor_config:
      return_60d: 0.4
      volatility_60d_negative: 0.3
      max_drawdown_60d_negative: 0.3

  - name: "hsf_10_hs300_defensive_trend_top20"
    universe_name: "hs300"
    top_n: 20
    factor_config:
      return_60d: 0.4
      volatility_60d_negative: 0.3
      max_drawdown_60d_negative: 0.3

  - name: "hsf_11_hs300_turnover_defensive_top10"
    universe_name: "hs300"
    top_n: 10
    factor_config:
      turnover_mean_20d: 0.5
      volatility_60d_negative: 0.25
      max_drawdown_60d_negative: 0.25

  - name: "hsf_12_hs300_turnover_defensive_top20"
    universe_name: "hs300"
    top_n: 20
    factor_config:
      turnover_mean_20d: 0.5
      volatility_60d_negative: 0.25
      max_drawdown_60d_negative: 0.25
