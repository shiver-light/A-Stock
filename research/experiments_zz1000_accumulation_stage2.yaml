global:
  # Stage 2 for zz1000 accumulation proxies:
  # keep only the candidates that survived the first pass and stress them with
  # stricter tradability assumptions.
  start_date: "20230101"
  end_date: "20260331"
  benchmark_code: "000300.SH"
  top_n: 50
  enable_factor_diagnostics: true
  analysis_horizons:
    - 5
    - 10
    - 20
  backtest_config:
    slippage_bps: 15.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 800000.0

experiments:
  - name: "aa2_01_zz1000_position_safety_top50"
    universe_name: "zz1000"
    top_n: 50
    factor_config:
      position_safety_60d: 1.0

  - name: "aa2_02_zz1000_hidden_safety_top50"
    universe_name: "zz1000"
    top_n: 50
    factor_config:
      high_turnover_low_range_20d: 0.7
      position_safety_60d: 0.3

  - name: "aa2_03_zz1000_flow_hidden_safety_top50"
    universe_name: "zz1000"
    top_n: 50
    factor_config:
      money_flow_strength_20d: 0.4
      high_turnover_low_range_20d: 0.3
      position_safety_60d: 0.3
