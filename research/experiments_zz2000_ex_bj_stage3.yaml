global:
  # Stage 3 for zz2000_ex_bj:
  # remove the close-near-high factor after stage2 showed adverse single-factor
  # diagnostics, and only validate clean position-safety / turnover-stability
  # lines under the same strict tradability assumptions.
  # This remains an approximation of zz2000 because current data coverage for
  # some BJ constituents is incomplete.
  start_date: "20230101"
  end_date: "20260331"
  benchmark_code: "000300.SH"
  top_n: 120
  enable_factor_diagnostics: true
  analysis_horizons:
    - 5
    - 10
    - 20
  backtest_config:
    slippage_bps: 20.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 1200000.0

experiments:
  - name: "z20x3_01_zz2000_ex_bj_position_safety_top120"
    universe_name: "zz2000_ex_bj"
    top_n: 120
    factor_config:
      position_safety_60d: 1.0

  - name: "z20x3_02_zz2000_ex_bj_position_safety_top200"
    universe_name: "zz2000_ex_bj"
    top_n: 200
    factor_config:
      position_safety_60d: 1.0

  - name: "z20x3_03_zz2000_ex_bj_turnover_stability_top120"
    universe_name: "zz2000_ex_bj"
    top_n: 120
    factor_config:
      turnover_stability_20d: 1.0

  - name: "z20x3_04_zz2000_ex_bj_turnover_stability_top200"
    universe_name: "zz2000_ex_bj"
    top_n: 200
    factor_config:
      turnover_stability_20d: 1.0

  - name: "z20x3_05_zz2000_ex_bj_turnover_stability_safety_70_30_top120"
    universe_name: "zz2000_ex_bj"
    top_n: 120
    factor_config:
      turnover_stability_20d: 0.7
      position_safety_60d: 0.3

  - name: "z20x3_06_zz2000_ex_bj_turnover_stability_safety_70_30_top200"
    universe_name: "zz2000_ex_bj"
    top_n: 200
    factor_config:
      turnover_stability_20d: 0.7
      position_safety_60d: 0.3

  - name: "z20x3_07_zz2000_ex_bj_turnover_stability_safety_50_50_top120"
    universe_name: "zz2000_ex_bj"
    top_n: 120
    factor_config:
      turnover_stability_20d: 0.5
      position_safety_60d: 0.5

  - name: "z20x3_08_zz2000_ex_bj_turnover_stability_safety_50_50_top200"
    universe_name: "zz2000_ex_bj"
    top_n: 200
    factor_config:
      turnover_stability_20d: 0.5
      position_safety_60d: 0.5
