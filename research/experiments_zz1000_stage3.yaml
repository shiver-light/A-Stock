global:
  # Stage 3 for zz1000:
  # stop expanding factor space and only test whether the illiq-driven line
  # can survive under stricter tradability assumptions.
  start_date: "20230101"
  end_date: "20260331"
  benchmark_code: "000300.SH"
  top_n: 50
  enable_factor_diagnostics: true
  analysis_horizons:
    - 5
    - 10
    - 20

experiments:
  - name: "z3_i01_zz1000_illiq_top50_amt500k_slip10"
    universe_name: "zz1000"
    top_n: 50
    backtest_config:
      slippage_bps: 10.0
      block_suspended: true
      block_limit_up_buy: true
      block_limit_down_sell: true
      min_amount: 500000.0
    factor_config:
      illiq_negative: 1.0

