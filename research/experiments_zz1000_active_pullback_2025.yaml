global:
  # Active pullback research for zz1000.
  # Window: 2025-01-01 to 2026-04-30.
  # This is a short-term active-stock pullback idea, but the current backtest
  # engine still uses the repository's existing monthly rebalance schedule.
  # Signal filters first define the active pool; factor_config then ranks
  # pullback/support quality within that active pool.
  start_date: "20250101"
  end_date: "20260430"
  benchmark_code: "000852.SH"
  top_n: 30
  enable_factor_diagnostics: true
  analysis_horizons:
    - 5
    - 10
    - 20
  backtest_config:
    slippage_bps: 15.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 300000.0

experiments:
  # Baseline: active 20-day winners with high turnover, then buy short-term pullback with support.
  - name: "z25ap_01_active_ret20_turnover_pullback_top30_amt300k"
    universe_name: "zz1000"
    top_n: 30
    signal_filters:
      - factor: "return_20d"
        op: "quantile_gte"
        value: 0.70
      - factor: "turnover_mean_20d"
        op: "quantile_gte"
        value: 0.70
    factor_config:
      pullback_after_trend_60d: 0.45
      return_5d_negative: 0.25
      down_day_absorption_20d: 0.20
      close_to_high_20d: 0.10

  - name: "z25ap_02_active_ret20_strict_turnover_pullback_top30_amt300k"
    universe_name: "zz1000"
    top_n: 30
