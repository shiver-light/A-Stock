global:
  # ZZ2000 ex-BJ excluding ChiNext and STAR volume/turnover low-position research stage3.
  # This stage keeps the relaxed MA20 tests from stage2 but excludes ChiNext and STAR constituents.
  # It is directly comparable to stage2 except for universe membership. Signal time: T close. Execution time: T+1.
  # Trading assumptions are unchanged from stage1.
  start_date: "20250101"
  end_date: "20260608"
  benchmark_code: "000985.CSI"
  universe_name: "zz2000_ex_bj_ex_chinext_star"
  rebalance_frequency: "daily"
  enable_factor_diagnostics: false
  analysis_horizons:
    - 1
    - 3
    - 5
    - 7
  backtest_config:
    slippage_bps: 15.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 300000.0

experiments:
  - name: "z20xvtlp3_01_ma0_vr18_turn2_12_low30_top120"
    top_n: 120
    signal_filters:
      - factor: "volume_ratio_5d"
        op: "gte"
        value: 1.8
      - factor: "turnover_rate_f"
        op: "between"
        min_value: 2.0
        max_value: 12.0
      - factor: "ma20_slope_1d"
        op: "gte"
        value: 0.0
      - factor: "price_position_120d"
        op: "lte"
        value: 0.30
      - factor: "daily_return"
        op: "between"
        min_value: -0.02
        max_value: 0.08
    factor_config:
      low_position_120d: 0.30
      volume_ratio_5d: 0.15
      ma20_slope_1d: 0.20
      turnover_rate_f: 0.15
      amount_mean_20d: 0.10
      false_breakout_risk_negative: 0.10

