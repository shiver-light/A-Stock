global:
  # Shareholder count decline decay-window comparison.
  # Universe excludes ChiNext, STAR Market, and ST stocks.
  # All holder decline factors require ann_date to be no more than 3 trading
  # days after end_date, then apply a linear decay after ann_date.
  # Signal time: T close. Execution time: T+1.
  start_date: "20250101"
  end_date: "20260608"
  benchmark_code: "000985.CSI"
  universe_name: "all_a_ex_chinext_star_st"
  rebalance_frequency: "daily"
  enable_factor_diagnostics: false
  analysis_horizons:
    - 1
    - 3
    - 5
    - 10
    - 20
  backtest_config:
    slippage_bps: 15.0
    block_suspended: true
    block_limit_up_buy: true
    block_limit_down_sell: true
    min_amount: 300000.0
    position_exit_policy:
      enabled: true
      min_hold_days: 3
      max_hold_days: 20
      exit_filters:
        - factor: "price_position_120d"
          op: "lte"
          value: 0.65
        - factor: "false_breakout_risk_negative"
          op: "gte"
          value: -0.08

experiments:
  - name: "hdeclwin_01_decay3_single_top30"
    top_n: 30
    signal_filters:
      - factor: "holder_num_change_ratio_negative_fresh_3d_decay_3d"
        op: "gte"
        value: 0.010
    factor_config:
      holder_num_change_ratio_negative_fresh_3d_decay_3d: 1.00

  - name: "hdeclwin_02_decay3_low_position_top30"
    top_n: 30
    signal_filters:
      - factor: "holder_num_change_ratio_negative_fresh_3d_decay_3d"
        op: "gte"
        value: 0.010
      - factor: "price_position_120d"
        op: "lte"
        value: 0.50
    factor_config:
      holder_num_change_ratio_negative_fresh_3d_decay_3d: 0.55
      low_position_120d: 0.25
      amount_mean_20d: 0.20

  - name: "hdeclwin_03_decay3_risk_control_top30"
    top_n: 30
    signal_filters:
      - factor: "holder_num_change_ratio_negative_fresh_3d_decay_3d"
        op: "gte"
        value: 0.010
      - factor: "price_position_120d"
        op: "lte"
        value: 0.50
      - factor: "daily_return"
        op: "between"
        min_value: -0.03
        max_value: 0.08
    factor_config:
      holder_num_change_ratio_negative_fresh_3d_decay_3d: 0.40
      low_position_120d: 0.20
      false_breakout_risk_negative: 0.15
      volatility_20d_negative: 0.15
      amount_mean_20d: 0.10

